@if (bestValue) {
  <div class="banner" [style.border-left-color]="bestValue.operatorColor">
    <div class="banner__icon">🏆</div>
    <div class="banner__content">
      <span class="banner__tag">Meilleur rapport data / prix</span>
      <p class="banner__title">
        <strong>{{ bestValue.operatorName }}</strong> — {{ bestValue.plan.name }}
      </p>
      <p class="banner__detail">
        <strong>{{ dataLabel }}</strong> pour
        <strong>{{ bestValue.plan.price | number:'1.0-0' }} FCFA</strong>
        · {{ (bestValue.ratio).toFixed(2) }} Mo / FCFA
      </p>
    </div>
    <div class="banner__price" [style.color]="bestValue.operatorColor">
      {{ bestValue.plan.price | number:'1.0-0' }}<span>FCFA</span>
    </div>
  </div>
}
