<div class="filter-bar">
  @if (label) {
    <span class="filter-bar__label">{{ label }}</span>
  }
  @for (opt of options; track opt.value) {
    <button
      pButton
      type="button"
      [label]="opt.label"
      [class]="active === opt.value ? 'p-button-sm' : 'p-button-sm p-button-outlined'"
      (click)="change.emit(opt.value)"
    ></button>
  }
</div>
