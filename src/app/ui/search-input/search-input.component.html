<span class="p-input-icon-left search-wrapper">
  <i class="pi pi-search"></i>
  <input
    pInputText
    type="text"
    [placeholder]="placeholder"
    [(ngModel)]="value"
    (ngModelChange)="onInput($event)"
    class="search-input"
  />
  @if (value) {
    <button
      pButton
      type="button"
      icon="pi pi-times"
      class="p-button-text p-button-rounded p-button-sm search-clear"
      (click)="clear()"
    ></button>
  }
</span>
